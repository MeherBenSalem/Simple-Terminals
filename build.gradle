// Root aggregator for OmniVault (NightBeam convention, modelled on MeherBenSalem/Bosses).
//
// Each Minecraft version folder is its own Gradle build with its own wrapper; this build only drives them.
//   ./gradlew buildAll      build every workspace, then copy exactly the 8 loader jars into releases/
//   ./gradlew build262      build one workspace (keys: 1201, 1211, 262, 263)
//   ./gradlew checkVersions fail unless every workspace has the same version=
//   ./gradlew syncVersion -PmodVersion=x.y.z
//
// Java: 1.20.1 (Java 17 bytecode) and 1.21.1 run their Gradle on Java 21; the 26.x builds need Gradle itself on
// Java 25. Pass -Pjava21Home=<jdk> / -Pjava25Home=<jdk>, or set JAVA_HOME_21_X64 / JAVA_HOME_25_X64 (setup-java
// does). Without them a workspace inherits this build's JAVA_HOME.

import java.nio.file.Files
import java.nio.file.StandardCopyOption

String wrapperCmd(String rootDirName) {
    File root = file(rootDirName)
    if (System.getProperty('os.name').toLowerCase().contains('win')) {
        return new File(root, 'gradlew.bat').absolutePath
    }
    return new File(root, 'gradlew').absolutePath
}

Properties workspaceProps(String dir) {
    def props = new Properties()
    def f = file("${dir}/gradle.properties")
    if (!f.exists()) {
        throw new GradleException("Missing ${f}")
    }
    f.withInputStream { props.load(it) }
    return props
}

// The 8 supported targets: 1.20.1 Fabric + Forge; 1.21.1, 26.2, 26.3 Fabric + NeoForge.
def workspaces = [
    '1201': [dir: '1.20.1', loaders: ['fabric', 'forge'], java: 21],
    '1211': [dir: '1.21.1', loaders: ['fabric', 'neoforge'], java: 21],
    '262' : [dir: '26.2', loaders: ['fabric', 'neoforge'], java: 25],
    '263' : [dir: '26.3', loaders: ['fabric', 'neoforge'], java: 25],
]
def javaHomes = [
    21: findProperty('java21Home') ?: System.getenv('JAVA_HOME_21_X64'),
    25: findProperty('java25Home') ?: System.getenv('JAVA_HOME_25_X64'),
]
// Lets each workspace's toolchain lookup find the JDKs setup-java installs (Java 17 for 1.20.1 bytecode).
def toolchainEnv = '-Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64'
def loaderNames = [fabric: 'Fabric', forge: 'Forge', neoforge: 'NeoForge']

// <mod_id>-<loader>-<minecraft>-<version>.jar, from each workspace's own gradle.properties.
def expectedJars = workspaces.values().collectMany { ws ->
    def props = workspaceProps(ws.dir)
    ws.loaders.collect { loader ->
        def name = "${props.mod_id}-${loader}-${props.minecraft_version}-${props.version}.jar"
        file("${ws.dir}/${loader}/build/libs/${name}")
    }
}
def workspaceVersions = workspaces.values().collectEntries { ws -> [(ws.dir): workspaceProps(ws.dir).version] }

tasks.register('checkVersions') {
    group = 'verification'
    description = 'Fail unless every workspace gradle.properties has the same version=.'
    doLast {
        def distinct = workspaceVersions.values().toSet()
        if (distinct.size() != 1 || distinct.contains(null)) {
            throw new GradleException("Workspace versions differ: ${workspaceVersions}")
        }
        println "All workspaces at version ${distinct.first()}"
    }
}

def previous = null
workspaces.each { key, ws ->
    def javaHome = javaHomes[ws.java]
    def buildTask = tasks.register("build${key}", Exec) {
        group = 'build'
        description = "Build all ${ws.dir} loaders (${ws.loaders.collect { loaderNames[it] }.join(' + ')})."
        workingDir = file(ws.dir)
        commandLine wrapperCmd(ws.dir), 'build', toolchainEnv
        if (javaHome) environment 'JAVA_HOME', javaHome
    }
    // One workspace at a time: each runs its own Gradle with -Xmx3G.
    if (previous != null) {
        def before = previous
        buildTask.configure { mustRunAfter before }
    }
    previous = buildTask

    tasks.register("clean${key}", Exec) {
        group = 'build'
        description = "Clean the ${ws.dir} workspace."
        workingDir = file(ws.dir)
        commandLine wrapperCmd(ws.dir), 'clean'
        if (javaHome) environment 'JAVA_HOME', javaHome
    }
}

tasks.register('dist') {
    group = 'build'
    description = 'Build every workspace and copy the 8 loader jars into releases/.'
    dependsOn 'checkVersions'
    dependsOn workspaces.keySet().collect { "build${it}" }
    def outDir = file('releases')
    def jars = expectedJars
    doLast {
        def missing = jars.findAll { !it.isFile() }
        if (missing) {
            throw new GradleException("Missing loader jars:\n  ${missing.join('\n  ')}")
        }
        outDir.mkdirs()
        jars.each { jar ->
            Files.copy(jar.toPath(), new File(outDir, jar.name).toPath(), StandardCopyOption.REPLACE_EXISTING)
            println "  ${jar.name}"
        }
        println "${jars.size()} loader jars collected in: ${outDir.absolutePath}"
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build every workspace and collect the 8 loader jars into releases/.'
    dependsOn 'dist'
}

tasks.register('build') {
    group = 'build'
    description = 'Alias for buildAll so ./gradlew build still produces every loader jar.'
    dependsOn 'buildAll'
}

tasks.register('cleanAll') {
    group = 'build'
    description = 'Clean every workspace (releases/ is left as it is).'
    dependsOn workspaces.keySet().collect { "clean${it}" }
}

tasks.register('syncVersion') {
    group = 'build'
    description = 'Set version= in every workspace gradle.properties (use -PmodVersion=x.y.z).'
    def v = findProperty('modVersion')
    def files = workspaces.values().collect { file("${it.dir}/gradle.properties") }
    doLast {
        if (!v) {
            throw new GradleException('Pass -PmodVersion=x.y.z')
        }
        files.each { f ->
            if (!f.exists()) {
                throw new GradleException("Missing ${f}")
            }
            def updated = false
            def out = f.readLines().collect { line ->
                if (line.startsWith('version=')) {
                    updated = true
                    return "version=${v}"
                }
                return line
            }
            if (!updated) {
                throw new GradleException("No version= line in ${f}")
            }
            f.text = out.join(System.lineSeparator()) + System.lineSeparator()
            println "Synced ${f} -> ${v}"
        }
    }
}
