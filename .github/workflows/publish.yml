# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
#
# Rule: EACH jar becomes its OWN Modrinth version and OWN CurseForge file
# with the correct Minecraft version + loader tags. Never attach multiple
# loader/MC jars as secondary files on a single version.
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"
      platforms:
        description: "modrinth, curseforge, or both"
        required: false
        default: "both"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        run: |
          set -euo pipefail
          if [ -d releases ] && [ -n "$(find releases -type f -name '*.jar' -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Prebuilt release directory found; the complete set must pass the release guard"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No prebuilt jars; build all six loader artifacts"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Verify source resources and release guard tests
        run: python3 -m unittest discover -s tests -v

      - name: Test native Minecraft recipe and loot implementations
        run: python3 tests/native_recipe/run.py --java "$JAVA_HOME_25_X64/bin/java"

      - name: Test native 26.2 registry-property construction
        run: python3 tests/native_registry_ids/run.py --java "$JAVA_HOME_25_X64/bin/java"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true'

      - name: Build MultiLoader workspaces
        if: steps.prebuilt.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for ws in 1.20.1 1.21.1 26.2; do
            case "$ws" in
              26.2) build_java="$JAVA_HOME_25_X64" ;;
              *) build_java="$JAVA_HOME_21_X64" ;;
            esac
            echo "Building workspace $ws with $build_java"
            (
              cd "$ws"
              export JAVA_HOME="$build_java"
              export PATH="$JAVA_HOME/bin:$PATH"
              bash gradlew clean build --no-daemon --stacktrace
            )
          done

      - name: Validate complete packaged release and version-specific notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 scripts/release_guard.py --version "$VERSION" \
            --manifest .release-manifest.json --notes .release-notes.md

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge (one version per jar)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || 'Ss3e4qjk' }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || '1528758' }}
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_MANIFEST: .release-manifest.json
          RELEASE_NOTES: .release-notes.md
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          // Verified public Simple Terminals project IDs. Never publish to a different configured project.
          if (process.env.MODRINTH_ID !== 'Ss3e4qjk' || process.env.CURSEFORGE_ID !== '1528758') {
            throw new Error('Configured publish destination is not the verified Simple Terminals project');
          }
          const version = process.env.VERSION;
          const platforms = (process.env.PLATFORMS || 'both').toLowerCase();
          if (!['both', 'modrinth', 'curseforge'].includes(platforms)) {
            throw new Error('Unsupported publish platforms: ' + platforms);
          }
          const doModrinth = platforms === 'both' || platforms === 'modrinth';
          const doCurse = platforms === 'both' || platforms === 'curseforge';
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_MANIFEST, 'utf8'));
          if (manifest.version !== version || manifest.artifacts.length !== 6) {
            throw new Error('Missing or mismatched validated release manifest');
          }
          // Check all six artifacts before the first API request and reuse exactly these bytes.
          const jars = manifest.artifacts.map((artifact) => {
            const bytes = fs.readFileSync(artifact.path);
            for (const algorithm of ['sha256', 'sha1', 'sha512']) {
              const digest = crypto.createHash(algorithm).update(bytes).digest('hex');
              if (digest !== artifact.hashes?.[algorithm]) {
                throw new Error('Artifact hash mismatch: ' + path.basename(artifact.path) + ' (' + algorithm + ')');
              }
            }
            return { ...artifact, bytes };
          });
          const changelog = fs.readFileSync(process.env.RELEASE_NOTES, 'utf8');
          if (!changelog.trim()) throw new Error('Missing version-specific release notes');

          // Stable CurseForge loader version IDs (Upload API Game Versions docs)
          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150 };

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry && (entry.id != null) && entry.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            const loose = flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return loose?.id;
          }

          (async () => {
            if (doModrinth) {
              let uploaded = 0;
              for (const artifact of jars) {
                const { path: jar, loader, minecraft: gv } = artifact;
                const gameVersions = [gv];
                // One Modrinth version per jar — never multi-file attach across loaders/MC lines
                const body = {
                  name: `${version} · ${loader} · ${gameVersions[0]}`,
                  version_number: `${version}+${loader}-${gameVersions[0]}`,
                  changelog,
                  dependencies: [],
                  game_versions: gameVersions,
                  version_type: 'release',
                  loaders: [loader],
                  featured: false,
                  status: 'listed',
                  project_id: process.env.MODRINTH_ID,
                  file_parts: ['file_0'],
                  primary_file: 'file_0',
                };
                const form = new FormData();
                form.append('data', JSON.stringify(body));
                form.append('file_0', new Blob([artifact.bytes]), path.basename(jar));
                const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                  method: 'POST',
                  headers: { Authorization: process.env.MODRINTH_TOKEN },
                  body: form,
                });
                const mrText = await mrRes.text();
                if (!mrRes.ok) throw new Error('Modrinth ' + mrRes.status + ' ' + mrText.slice(0, 500));
                console.log('Modrinth OK', body.version_number, path.basename(jar), mrText.slice(0, 160));
                uploaded += 1;
              }
              console.log('Modrinth uploaded', uploaded, 'separate version(s)');
            } else {
              console.log('Skipping Modrinth (platforms=' + platforms + ')');
            }

            if (!doCurse) {
              console.log('Skipping CurseForge (platforms=' + platforms + ')');
              return;
            }

            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) {
              flat = flattenVersions(await uploadGv.json());
              console.log('CurseForge versions via upload API:', flat.length);
            } else {
              console.warn('Upload game/versions failed', uploadGv.status, (await uploadGv.text()).slice(0, 200));
            }
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              const gvText = await gvRes.text();
              if (!gvRes.ok) throw new Error('CurseForge versions ' + gvRes.status + ' ' + gvText.slice(0, 300));
              flat = flattenVersions(JSON.parse(gvText));
              console.log('CurseForge versions via core API:', flat.length);
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            let uploaded = 0;
            for (const artifact of jars) {
              const { path: jar, loader, minecraft: want } = artifact;
              const mcId = findVersionId(flat, want);
              const loaderId = LOADER_IDS[loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) {
                throw new Error('No CurseForge game version id for ' + want + ' (' + path.basename(jar) + ')');
              }
              const gameVersions = [mcId];
              if (loaderId != null) gameVersions.push(loaderId);
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              const gameVersionNames = [];
              if (clientId == null) gameVersionNames.push('Client');
              if (serverId == null) gameVersionNames.push('Server');
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${loader} · ${want}`,
                gameVersions,
                releaseType: 'release',
              };
              if (gameVersionNames.length) meta.gameVersionNames = gameVersionNames;
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([artifact.bytes]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, path.basename(jar), cfText.slice(0, 160));
              uploaded += 1;
            }
            console.log('CurseForge uploaded', uploaded, 'separate file(s) to project', process.env.CURSEFORGE_ID);
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
