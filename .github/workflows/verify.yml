name: Verify recipes and builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate source resources
        run: python3 -m unittest discover -s tests -v
      - name: Test original Minecraft recipe and loot implementations
        run: python3 tests/native_recipe/run.py --java "$JAVA_HOME/bin/java"
      - name: Test 26.2 registry-property construction
        run: python3 tests/native_registry_ids/run.py --java "$JAVA_HOME/bin/java"

  loader-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.20.1', '1.21.1', '26.2']
        include:
          - minecraft: '1.20.1'
            java: '21'
          - minecraft: '1.21.1'
            java: '21'
          - minecraft: '26.2'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - name: Select build JDK
        run: echo "JAVA_HOME=${JAVA_HOME_${{ matrix.java }}_X64}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders
        working-directory: ${{ matrix.minecraft }}
        run: bash gradlew build --no-daemon --stacktrace
      - name: Verify survival resources in both packaged loader jars
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MC_VERSION" in
            1.20.1) loaders=(fabric forge) ;;
            *) loaders=(fabric neoforge) ;;
          esac
          args=()
          for loader in "${loaders[@]}"; do
            mapfile -t jars < <(find "$MC_VERSION/$loader/build/libs" -maxdepth 1 -type f \
              -name 'simple-terminals-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' | sort)
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "Expected one distributable $loader jar, found ${#jars[@]}" >&2
              exit 1
            fi
            args+=(--jar "$MC_VERSION:${jars[0]}")
          done
          python3 tests/test_terminal_recipe_resources.py "${args[@]}" -v
      - name: Retain tested loader jars
        uses: actions/upload-artifact@v4
        with:
          name: simple-terminals-${{ matrix.minecraft }}
          path: |
            ${{ matrix.minecraft }}/fabric/build/libs/*.jar
            ${{ matrix.minecraft }}/forge/build/libs/*.jar
            ${{ matrix.minecraft }}/neoforge/build/libs/*.jar
          if-no-files-found: error
