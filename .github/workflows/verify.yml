name: Verify build and GameTests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow (the texture tests read PNGs)
        run: python3 -m pip install pillow==11.3.0
      - name: Lang fragments are merged
        run: python3 tools/assets/build_lang.py --check
      - name: Resource and release-guard tests
        run: python3 -m unittest discover -s tests -v

  minecraft:
    # One job per Minecraft version builds both of its loaders together: the release guard checks
    # them as one release.
    name: minecraft-${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            java: '17'
            fml: forge
          - minecraft: '1.21.1'
            java: '21'
            fml: neoforge
          - minecraft: '26.2'
            java: '25'
            fml: neoforge
          - minecraft: '26.3'
            java: '25'
            fml: neoforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ matrix.minecraft }}
        run: bash gradlew build --no-daemon --stacktrace
      - name: Run GameTests on a ${{ matrix.fml }} server
        working-directory: ${{ matrix.minecraft }}
        run: bash gradlew :${{ matrix.fml }}:runGameTestServer --no-daemon --stacktrace
      - name: Run GameTests on a Fabric server
        working-directory: ${{ matrix.minecraft }}
        run: bash gradlew :fabric:runGametest --no-daemon --stacktrace
      - name: Validate the packaged jars
        shell: bash
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' "$MINECRAFT/gradle.properties")"
          python3 scripts/release_guard.py --source build --version "$version" --minecraft "$MINECRAFT" \
            --manifest "$RUNNER_TEMP/manifest.json" --notes "$RUNNER_TEMP/notes.md"
      - name: Keep the tested jars
        uses: actions/upload-artifact@v4
        with:
          name: omnivault-${{ matrix.minecraft }}
          path: |
            ${{ matrix.minecraft }}/${{ matrix.fml }}/build/libs/*.jar
            ${{ matrix.minecraft }}/fabric/build/libs/*.jar
          if-no-files-found: error
