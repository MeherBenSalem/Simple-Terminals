name: Verify build and GameTests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lang fragments are merged
        run: python3 tools/assets/build_lang.py --check
      - name: Resource and release-guard tests
        run: python3 -m unittest discover -s tests -v

  neoforge-1-21-1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: 1.21.1
        run: bash gradlew build --no-daemon --stacktrace
      - name: Run GameTests on a dedicated server
        working-directory: 1.21.1
        run: bash gradlew :neoforge:runGameTestServer --no-daemon --stacktrace
      - name: Validate the packaged jar
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' 1.21.1/gradle.properties)"
          python3 scripts/release_guard.py --source build --version "$version" \
            --manifest "$RUNNER_TEMP/manifest.json" --notes "$RUNNER_TEMP/notes.md"
      - name: Keep the tested jar
        uses: actions/upload-artifact@v4
        with:
          name: omnivault-1.21.1-neoforge
          path: 1.21.1/neoforge/build/libs/*.jar
          if-no-files-found: error
